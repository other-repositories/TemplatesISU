version: '3.9'
services:
  app-get:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8080"
    environment:
      - FLASK_ENV=development
    container_name: app-get

  app-post:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      - FLASK_ENV=development
    container_name: app-post

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-get
      - app-post
    container_name: nginx
